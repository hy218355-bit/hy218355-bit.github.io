<main><small>吹奏楽部のつくりかた</small><h1>朝野先生と、はじめの部活。</h1><p>楽器を決める → 曲を選ぶ → 練習する → 音を聴く。<br>4つの操作を、実際に触りながら覚えられます。</p><nav><a href="qa.html?session=owner-preview&theme=light">ライトで試す</a><a href="qa.html?session=owner-preview-dark&theme=dark">ダークで試す</a></nav><p>確認専用の部で遊べます。いつものセーブは変わりません。</p><figure><img src="comparison.png" width="750" height="812" alt="375pxの初回案内。左がライト、右がダーク。朝野先生と4段階の流れを表示"><figcaption>最初の案内・375px（ライト／ダーク）</figcaption></figure><figure><img src="listen-light.png" width="375" height="812" alt="最初の練習を終えて、合奏を聴く案内"><figcaption>練習した音を聴き、最初の本番へ。</figcaption></figure></main></html>
