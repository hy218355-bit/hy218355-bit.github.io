<main><h1>本番の前に、3つだけ確かめる</h1><p>人選・譜読み・体力を、実際に出る部員で確認。詳しく見たい項目だけを開き、演奏開始と指揮はいつも手元に置きました。</p><p><a href="/design/implementation/qa.html?view=prep-a&amp;theme=light&amp;keys=1">本番前を試す</a> · <a href="/design/implementation/qa.html?view=prep-week&amp;two=1&amp;theme=light&amp;keys=1">練習から準備する</a> · <a href="browser-check.json">確認記録</a></p>
<div class="grid"><figure><figcaption>実際に出る34人の準備・ライト</figcaption><img src="screenshots/overview-light.png" alt="人選34人、課題曲と自由曲の譜読み、体力が低い2人を3つのカードで表示"></figure><figure><figcaption>同じ準備・ダーク</figcaption><img src="screenshots/overview-dark.png" alt="ダークでもランクと開始・指揮の操作が見える本番前の画面"></figure><figure><figcaption>2曲の譜読みを、顔で確認</figcaption><img src="screenshots/reading-dark.png" alt="課題曲と自由曲を分け、低い部員から顔とGからSのランクを並べる"></figure><figure><figcaption>疲れた出場者だけを見る</figcaption><img src="screenshots/tired-light.png" alt="本番に出る人のうち体力が低い2人を、顔と名前で表示"></figure></div>
<details class="more"><summary>練習への移動・舞台袖・小さい画面</summary><div class="grid"><figure><figcaption>練習週は、顔から今週の指示へ</figcaption><img src="screenshots/weekly-rest-light.png" alt="休むを選んだ後に、元の体力の準備欄と本人の顔へ戻る"></figure><figure><figcaption>舞台袖で声をかける相手にも顔を</figcaption><img src="screenshots/wings-dark.png" alt="声かけと深呼吸の2回を使い、落ち着いた子とまだ緊張する子の顔が見える"></figure><figure><figcaption>320pxでも開始操作は画面内</figcaption><img src="screenshots/small-dark.png" alt="開始と指揮の48pxのボタンが下のタブバーの上に収まる"></figure></div></details>
