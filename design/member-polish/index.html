<main><h1>顔と成長が見える部員の画面</h1>
<p>パート欄を小さくし、名簿の顔と名前を大きく。カードは、本人のひとことと入部からの4つのランクを先に見られます。譜読み・スキル・思い出は、押すと開く形です。</p>
<nav><a href="/design/implementation/qa.html?view=members&theme=light&keys=1">名簿をさわる</a><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">カードをさわる</a><a href="../selection-polish/">前回の人選</a></nav>
<h2>名簿 · 375px</h2><div class="grid">
<figure><figcaption>ライト</figcaption><img src="screenshots/roster-light.png" alt="顔と名前が最初の画面から見える部員一覧・ライト"></figure>
<figure><figcaption>ダーク</figcaption><img src="screenshots/roster-dark.png" alt="パートのランクと大きくした顔が並ぶ部員一覧・ダーク"></figure></div>
<h2>部員カード · 375px</h2><p>右上の閉じるボタンも44px。名簿から開いたカードを閉じると、選んでいた人の位置に戻ります。</p><div class="grid">
<figure><figcaption>ライト</figcaption><img src="screenshots/card-light.png" alt="ひとことと入部からのランクを並べた部員カード・ライト"></figure>
<figure><figcaption>ダーク</figcaption><img src="screenshots/card-dark.png" alt="成長の4つのランクと折りたためる詳しい情報・ダーク"></figure></div>
<h2>入部したばかりの子</h2><div class="grid"><figure><figcaption>変わっていない力も、そのまま表示</figcaption><img src="screenshots/new-member-dark.png" alt="夢と、入部したばかりの力を表示した新入部員"></figure></div>
