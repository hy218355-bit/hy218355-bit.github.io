<main><h1>誰が、どの席へ移るか</h1><p>席を選ぶと、二人の顔と「元の席 → 移る席」を並べて確認。変わるランクも一緒に見せます。スマホでは確認欄がボタンに隠れない位置まで移り、決める前に二人の変化を見られます。</p>
<p><a href="/design/implementation/qa.html?view=member&amp;theme=light&amp;keys=1">部員カードで試す</a> · <a href="browser-check.json">操作の確認記録</a></p><p>確認ページは本物のセーブと設定を変更しません。iPhoneへのインストールは成功。端末のロックにより、実機での表示と音は未確認です。</p>
<div class="grid"><figure><figcaption>二人の移動前後・ライト</figcaption><img src="screenshots/swap-light.png" alt="田中七海はピッコロから打楽器へ、山田蓮は打楽器からピッコロへ。二人の顔と席の移動、下がるランクを表示"></figure><figure><figcaption>二人の移動前後・ダーク</figcaption><img src="screenshots/swap-dark.png" alt="同じ確認欄のダーク表示。移動先は金の枠で強調"></figure></div>
<details class="more"><summary>控え・再生中・長い名前も確認</summary><div class="grid"><figure><figcaption>控えへ移る</figcaption><img src="screenshots/bench-dark.png" alt="ピッコロから控えへの移動。変わらないランクは並べない"></figure><figure><figcaption>再生中に選ぶ</figcaption><img src="screenshots/playing-dark.png" alt="確認欄、席を移すボタン、録音の停止バーが重ならずに並ぶ"></figure><figure><figcaption>同じ楽器の席を交代</figcaption><img src="screenshots/same-instrument-dark.png" alt="二人のフルートの席を交代。元の席と移る席を表示"></figure><figure><figcaption>名前が長い場合</figcaption><img src="screenshots/long-names-dark.png" alt="本人と相手が12文字の名前でも横にはみ出さず、確認と決定ができる"></figure></div></details></main></html>
