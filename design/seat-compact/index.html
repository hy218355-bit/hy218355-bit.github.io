<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>席を、すぐ選べるように</title><style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}details{margin-top:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>席を、すぐ選べるように</h1><p>楽器をコンパクトにまとめ、開いたら移動先の顔が見える位置へ。未選択の「移す」は灰色、選んだら金色になります。</p><p><a href="/design/implementation/qa.html?view=member&amp;theme=light&amp;keys=1">席選びを試す</a> · <a href="browser-check.json">確認記録</a> · <a href="README.md">変更と確認の詳細</a></p><div class="grid"><figure><figcaption>開いたら、移動先が見える・ライト</figcaption><img src="screenshots/choices-light.png" alt="楽器9種類の下に、移動先の顔と灰色の確定ボタンを表示" loading="lazy"></figure><figure><figcaption>未選択・ダーク</figcaption><img src="screenshots/choices-dark.png" alt="未選択の移すボタンが灰色になり、押せない状態が分かる" loading="lazy"></figure><figure><figcaption>選んだら、二人の変化を確認</figcaption><img src="screenshots/selected-light.png" alt="移動前後の席と変わるランク、金色の確定ボタン" loading="lazy"></figure><figure><figcaption>選択後・ダーク</figcaption><img src="screenshots/selected-dark.png" alt="別の楽器への交代を二人の顔で確かめ、金色の移すを押せる状態" loading="lazy"></figure></div><details><summary>変更前・再生中・小さい画面・長い名前</summary><div class="grid"><figure><figcaption>変更前</figcaption><img src="screenshots/before-light.png" alt="顔と大きな楽器一覧で、移動先が画面下に隠れている" loading="lazy"></figure><figure><figcaption>部員一覧で再生中</figcaption><img src="screenshots/roster-playing-light.png" alt="席の確定操作と再生バーを重ねない" loading="lazy"></figure><figure><figcaption>320px・再生中</figcaption><img src="screenshots/small-playing-dark.png" alt="小さい画面でも最初の移動先と固定ボタンを操作できる" loading="lazy"></figure><figure><figcaption>12文字の相手も枠内へ</figcaption><img src="screenshots/long-small-dark.png" alt="長い名前がボタンを横へ押し広げない" loading="lazy"></figure><figure><figcaption>長い名前の交代予告</figcaption><img src="screenshots/long-preview-dark.png" alt="相手の名前と二人の移る席が画面内に収まる" loading="lazy"></figure></div></details><p><a href="/design/outing-faces/">行事の部員選びも、顔で分かりやすくしました。</a></p><p>確認ページは本物のセーブと設定を変更しません。iPhone向け最終ビルド成功。実機が接続できないため、最終版の入れ直しと実機での表示確認は未完了です。</p></main></html>
