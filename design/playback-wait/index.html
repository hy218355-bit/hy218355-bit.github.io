<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音を待つあいだも、同じメンバー</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>音を待つあいだも、同じメンバー。</h1><p>選んだ音の読み込みを待っている間も、曲名と舞台の顔をそろえました。中止したら今の部へ戻ります。</p><div class="grid"><figure><img src="screenshots/ensemble-light.png" alt="375pxライト設定。歓喜の歌の読み込み待ちで、選んだ5人だけが舞台にいる。範囲と指揮は無効"><figcaption>ライト · 5人の読み込み待ち</figcaption></figure><figure><img src="screenshots/ensemble-dark.png" alt="375pxダーク設定。同じ5人と歓喜の歌を表示し、読み込みの文を保つ"><figcaption>ダーク · 同じ5人の読み込み待ち</figcaption></figure></div><nav><a href="../implementation/qa.html?view=ensemble&amp;ensembleDifferent=1&amp;theme=light">アンサンブルを試す</a><a href="../implementation/qa.html?view=record-library&amp;different=1&amp;theme=dark">昔の録音を試す</a></nav><details><summary>昔の録音も、当時の本人へ</summary><p>音源を待っている間に顔を押しても、当時の名前・学年・楽器・力を表示します。中止すると当時のカードを閉じます。</p><figure style="max-width:375px;margin:auto"><img src="screenshots/recorded-dark.png" alt="375×667。新世界の録音を待機中に、当時の田中七海・3年・ピッコロのカードを開く。編集の操作はない"><figcaption>375×667 · 録音時の本人</figcaption></figure></details><p class="note">音源待機・録音切り替え・今の本人だけの試聴・1年分の進行を確認済み。<br>iPhoneへ導入済み。端末ロック中のため、起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
