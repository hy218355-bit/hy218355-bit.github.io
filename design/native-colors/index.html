<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>起動から、同じ紙色に</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--paper,#F0EEE5);color:var(--ink,#263D43);font-family:system-ui,sans-serif}main{max-width:650px;margin:auto;padding:26px 20px 32px}header{display:flex;align-items:center;gap:14px}header img{width:60px;height:60px;border-radius:14px}small{font-size:11px;opacity:.75}h1{font-size:22px;line-height:1.5;margin:3px 0 0}p{font-size:13px;line-height:1.8}h2{font-size:14px;margin:24px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{border:1px solid var(--line,#D4D7C9);border-radius:14px;overflow:hidden}.tile>b{display:block;padding:10px;font-size:12px;border-bottom:1px solid var(--line,#D4D7C9)}.swatch{height:106px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}.swatch+div{border-top:1px dashed var(--line)}.swatch span{padding:5px 9px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}.codes{display:block;text-align:center;font:11px/1.8 ui-monospace,monospace;padding:6px 0}.accent{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--on-brass)}.note{font-size:11px;opacity:.8;margin-top:24px}nav{display:flex;gap:14px;margin:18px 0;font-size:12px}a{color:inherit}footer{border-top:1px solid var(--line);padding-top:12px;font-size:11px;line-height:1.8}
</style></head><body><main><header><img src="/tsukurikata/icon-180.png" alt="承認済みの校章と音符のアプリアイコン"><div><small>iOS · 配色の比較</small><h1>起動から、同じ紙色に。</h1></div></header><p>起動時の背景とiOSの操作色を、ゲーム内の色にそろえました。</p><h2>背景の切り替わり</h2><div class="grid"><section class="tile"><b>以前</b><div class="swatch" id="beforePaper"><span>起動時</span></div><div class="swatch afterPaper"><span>ゲーム内</span></div><small class="codes" id="beforePaperCode"></small></section><section class="tile"><b>統一後</b><div class="swatch afterPaper"><span>起動時</span></div><div class="swatch afterPaper"><span>ゲーム内</span></div><small class="codes" id="afterPaperCode"></small></section></div><h2>iOSの操作色</h2><div class="grid"><div><span class="accent" id="beforeAccent">以前</span><small class="codes" id="beforeAccentCode"></small></div><div><span class="accent" id="afterAccent">統一後</span><small class="codes" id="afterAccentCode"></small></div></div><p class="note">配色プレビューです。実機の起動画面ではありません。</p><nav><a href="?theme=light">ライト</a><a href="?theme=dark">ダーク</a><a href="README.md">確認の記録</a></nav><footer id="status">配色を読み込み中</footer></main><script>
// プレビューも、変更前と変更後の色の記録をそのまま使う。
(async()=>{const p=await(await fetch('palette.json')).json(),theme=new URLSearchParams(location.search).get('theme')==='dark'?'dark':'light',pick=name=>p[name].variants.find(v=>v.theme===theme),paper=pick('Paper'),accent=pick('AccentColor');document.documentElement.dataset.theme=theme;const root=document.documentElement.style;root.setProperty('--paper',paper.after);root.setProperty('--ink',theme==='dark'?'#F3F0E4':'#263D43');root.setProperty('--line',theme==='dark'?'#42565B':'#D4D7C9');root.setProperty('--on-brass',theme==='dark'?'#25373B':'#FCF8ED');document.querySelector('#beforePaper').style.background=paper.before;for(const el of document.querySelectorAll('.afterPaper'))el.style.background=paper.after;for(const [id,value] of Object.entries({beforePaperCode:paper.before+' → '+paper.after,afterPaperCode:paper.after+' → '+paper.after,beforeAccentCode:accent.before,afterAccentCode:accent.after}))document.querySelector('#'+id).textContent=value;document.querySelector('#beforeAccent').style.background=accent.before;document.querySelector('#afterAccent').style.background=accent.after;document.querySelector('#status').textContent='iPhoneへ導入済み。端末ロック中で起動は未確認。ミラーリングなし。';document.documentElement.dataset.ready='true';})();
</script></body></html>
