</style></head><body><main><p class="note">B · 舞台の中へ</p><h1>39人と、拍を合わせる。</h1><p>選んだB案をゲームに反映しました。広い舞台の下に、横から届く光と大きなタップ。上・下で音の強弱を変えられます。</p><nav class="actions"><a href="../implementation/qa.html?view=rehearsal&amp;cueFx=full&amp;audioPiece=pomp&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=rehearsal&amp;cueFx=full&amp;audioPiece=pomp&amp;theme=dark">ダークで試す</a><a href="../../tsukurikata/">ゲームを開く</a></nav><p class="note">確認用の「試す」ではセーブを書き換えません。合奏から「指揮する」で開始できます。</p><div class="grid"><figure><img src="screenshots/ready-light.png" alt="B案を反映した実際の指揮画面。375pxのライト"><figcaption>375px · ライト</figcaption></figure><figure><img src="screenshots/ready-dark.png" alt="B案を反映した実際の指揮画面。375pxのダーク"><figcaption>375px · ダーク</figcaption></figure></div><details><summary>小さい画面と演出を減らす設定</summary><div class="grid"><figure><img src="screenshots/compact-light.png" alt="375×667のライト。演奏中の操作面も画面内に収まる"><figcaption>375×667 · 演出なし</figcaption></figure><figure><img src="screenshots/compact-dark.png" alt="375×667のダーク。光を固定した短い演出"><figcaption>375×667 · 演出短く</figcaption></figure></div></details><p class="note">iPhoneへ導入・起動確認済み。ミラーリングなし。実機の画面・音・操作感は端末で確認できます。<br>codex/design · pushなし · <a href="README.md">確認の記録</a></p></main></body></html>
