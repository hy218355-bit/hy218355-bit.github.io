</style></head><body><main><p>B · 舞台の中へ</p><h1>この子の音から、みんなの音へ。</h1><p>本人・パートのボタンを押すと、金色のチェックで聴いている対象が分かります。もう一度押すと全員の音へ戻り、演奏はそのまま続きます。</p><div class="grid"><figure><img src="screenshots/solo-light.png" alt="375pxライト。田中七海のカードでこの人だけ聴くに金色の面とチェックが付き、本人を聴いていることを示す"><figcaption>ライト · 本人の音を試聴中</figcaption></figure><figure><img src="screenshots/solo-dark.png" alt="375pxダーク。同じ本人の試聴。パートのボタンは通常表示のままで、対象を区別する"><figcaption>ダーク · 同じボタンで全員へ戻る</figcaption></figure></div><nav><a href="../implementation/qa.html?view=member&amp;memberListenAudit=1&amp;performanceAudit=1&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=member&amp;memberListenAudit=1&amp;performanceAudit=1&amp;theme=dark">ダークで試す</a></nav><details><summary>小さい画面と、パートの読み込み待ち</summary><p>375×667でもチェックで対象が分かり、待っている間に全員へ戻すこともできます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。パートだけ聴くを選び、金色とチェックで示す"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。読み込み待ちのパートの指定と、全員へ戻すボタン"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲・本人とパートの音・入力と開いた内容の保持・自然終了・1年分の進行を確認済み。<br>iPhoneへ更新済み。今回は端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
