</style></head><body><main><p>B · 舞台の中へ</p><h1>この曲を、いまの部で。</h1><p>聴いている曲と聴き方が、金色の枠で分かります。同じボタンでもう一度押すと止まり、読み込み中も中止できます。</p><div class="grid"><figure><img src="screenshots/selection-light.png" alt="375pxライト。新世界よりをいまの部で再生し、曲のカードと止めるボタンに金色の枠が付く"><figcaption>ライト · いまの部で試聴中</figcaption></figure><figure><img src="screenshots/selection-dark.png" alt="375pxダーク。同じ曲と聴き方を金色で示し、一覧の下にも停止ボタンがある"><figcaption>ダーク · 同じ曲を試聴中</figcaption></figure></div><nav><a href="../implementation/qa.html?view=song-choice&amp;pieceAudit=1&amp;theme=light">自由曲を聴く</a><a href="../implementation/qa.html?view=song-set&amp;pieceAudit=1&amp;theme=dark">課題曲を聴く</a><a href="../implementation/qa.html?view=song-final&amp;pieceAudit=1&amp;theme=light">演奏会の曲を聴く</a></nav><details><summary>小さい画面と、読み込み待ち</summary><p>375×667でもボタンは44px以上。お手本・いまの部で・決めるを3列に保ちます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。定期演奏会の曲で、お手本の読み込み中ボタンを金色で示す"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。読み込み中でも同じボタンで中止できる"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲の試聴・切り替え・待機の中止・1年分の進行を確認済み。<br>iPhoneへ更新済み。端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
