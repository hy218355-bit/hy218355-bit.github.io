<main><h1>席を選ぶ、最後の一押しまで</h1><p>楽器をアイコンから選び、移る二人の顔と力を見比べる。「やめる／移す」は画面下に置き、合奏・指揮ボタンと重ならないようにしました。</p><p>聴きながらでも停止できます。部員一覧の小さな再生バーがあるときは、その上に間隔を空けて表示します。</p>
<p><a href="/design/implementation/qa.html?view=member&amp;theme=light&amp;keys=1">ライトで試す</a> · <a href="/design/implementation/qa.html?view=member&amp;theme=dark&amp;keys=1">ダークで試す</a> · <a href="browser-check.json">確認記録</a></p>
