<main><h1>楽器の音を、その場で読み直す</h1><p>音を読めなかったときに「読み直す」を表示。読めた録音は残し、読めなかった分だけ読み直します。演奏は一度止まり、読み直しただけでは自動再生しません。</p><p>下の見本は、確認用に1音源を読めなくしたものです。「読み直す」で通常の録音へ戻せます。</p>
<p><a href="/design/implementation/qa.html?view=stage&theme=light&keys=1&sampleFailure=once">ライトで試す</a> · <a href="/design/implementation/qa.html?view=stage&theme=dark&keys=1&sampleFailure=once">ダークで試す</a> · <a href="browser-check.json">確認記録</a></p>
