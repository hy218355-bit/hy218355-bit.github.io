<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指揮の数え始めを整える</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>止まったら、数え直せる。</h1><p>テンポ出しの途中で4拍を超えて手を止めたら、最初の案内へ。もう一度振った拍だけで、演奏を始めます。演奏が始まってからは、手を休めても部員が吹き続けます。</p><nav><a href="../implementation/qa.html?view=rehearsal&amp;audioPiece=spring&amp;cueFx=full&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=rehearsal&amp;audioPiece=pomp&amp;cueFx=off&amp;theme=dark">ダークで試す</a><a href="../conduct-downbeat/">1拍目の金色の合図</a></nav><p class="note">「指揮する」を開き、最初に2回だけタップして少し手を止めると、最初の案内へ戻ります。確認ページはセーブを書き換えません。</p><div class="grid"><figure><img src="screenshots/restart-light.png" alt="375pxライト。テンポ出しの中断後、古い回数と拍の枠が消え、まず4回の案内へ戻る"><figcaption>ライト · 数え始めの案内へ</figcaption></figure><figure><img src="screenshots/restart-dark.png" alt="375pxダーク。演出なしでも最初から数え直し、金色の予告で始められる"><figcaption>ダーク · 演出なしでも数え直し</figcaption></figure></div><p class="note">iPhoneへ導入済み。端末がロック中のため、今回は起動未確認です。実機の見え方・音・操作感は端末で確認できます。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
