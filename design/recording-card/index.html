</style></head><body><main><p>B · 舞台の中へ</p><h1>あの日の音を、一人ずつ。</h1><p>録音の顔を開き、同じボタンで本人と全員を聴き比べられます。別の人を開く・閉じると全員の音へ戻り、録音はそのまま続きます。</p><div class="grid"><figure><img src="screenshots/solo-light.png" alt="375pxライト。録音当時の田中七海の顔・3年生・ピッコロとAのランク。本人だけのときは全員の音にもどすボタンを金色にする"><figcaption>ライト · あの日の本人の音</figcaption></figure><figure><img src="screenshots/solo-dark.png" alt="375pxダーク。録音当時の小川悠斗のカードと金色の切り替えボタン。舞台も本人を選択している"><figcaption>ダーク · 別の部員を聴く</figcaption></figure></div><nav><a href="../implementation/qa.html?view=recorded-history&amp;libraryAudit=1&amp;recordCardAudit=1&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=recorded-history&amp;libraryAudit=1&amp;recordCardAudit=1&amp;theme=dark">ダークで試す</a></nav><details><summary>小さい画面でも</summary><p>375×667でも顔・名前・切り替え・ランクを表示し、下から録音を止められます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。録音のカードと44pxの切り替えボタン、下の停止ボタン"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。再生中の本人だけの指定を金色で示す"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲・待機からの切り替え・自然終了・1年分の進行を確認済み。<br>iPhoneへ更新し、起動に成功。実機の見た目と音はオーナー側で確認します。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
