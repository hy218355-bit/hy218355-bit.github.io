</style></head><body><main><p>B · 舞台の中へ</p><h1>再生したら、部員の顔が見える。</h1><p>診断を読んだ位置から合奏を始めても、舞台全体が見える位置へ。停止ボタンへ操作先を移し、再生と停止を続けて操作できます。</p><div class="grid"><figure><img src="screenshots/stage-light.png" alt="375×667ライト。診断の位置から再生後に曲名と39人の舞台全体が表示され、下に停止と指揮のボタンがある"><figcaption>ライト · 小さい画面でも舞台全体を</figcaption></figure><figure><img src="screenshots/stage-dark.png" alt="375×667ダーク。同じ演奏を続けながら舞台と停止ボタンを表示"><figcaption>ダーク · 停止へ操作先を渡す</figcaption></figure></div><p><a href="../implementation/qa.html?view=rehearsal&amp;stageRevealAudit=1&amp;performanceAudit=1&amp;theme=light">ライトで試す</a> · <a href="../implementation/qa.html?view=rehearsal&amp;stageRevealAudit=1&amp;performanceAudit=1&amp;theme=dark">ダークで試す</a></p><p class="note">見えている舞台は動かさず、部員カードからの試聴はカードの位置を保持。待機・中止・キーボード操作・1年分の進行を確認済み。<br>iPhoneへ導入済み。今回は端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
