<main><h1>席を移したら、音と表示も切り替わる</h1><p>「この人だけ聴く」の最中に控えへ移すと、古い演奏が鳴り続け、本人だけの試聴も残っていました。</p><ul><li>移動時に古い再生と読み込み待ちを止める。</li><li>控えになった人や空になったパートの試聴を、全員へ戻す。</li><li>カードの先頭で新しい席を確認。次の再生は新しい編成になる。</li></ul><p>保存済みの録音はそのままです。375pxのライト・ダークで確認し、iPhoneにも反映しました。</p><p><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">部員カードで試す</a> · <a href="browser-check.json">再生と移動の確認記録</a> · <a href="../seat-move-preview/">前回の移動前の予告</a></p><div class="grid"><figure><figcaption>控えへ移した後・ライト</figcaption><img src="screenshots/bench-light.png" alt="移動後のカードの先頭と停止した合奏の操作"></figure><figure><figcaption>ダーク</figcaption><img src="screenshots/bench-dark.png" alt="移動後の席をダーク表示でも確認"></figure></div></main></html>
