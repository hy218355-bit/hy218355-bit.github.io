<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>席の移動を元に戻す</title><style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>席も能力も、元に戻せる</h1><p>移動した直後、部員カードの上に「元に戻す」を表示。交代した二人の席と能力を、移動前に戻せます。取り消せるのは直前の1回だけ。改名や練習など、次の保存する操作をしたら終了します。</p><p><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">ライトで試す</a> · <a href="/design/implementation/qa.html?view=member&theme=dark&keys=1">ダークで試す</a> · <a href="browser-check.json">確認記録</a></p><div class="grid"><figure><figcaption>ライト・交代した直後</figcaption><img src="screenshots/moved-light.png" alt="カード上部に席を元に戻すボタン"></figure><figure><figcaption>ダーク・控えにした直後</figcaption><img src="screenshots/moved-dark.png" alt="控えへの移動も元に戻せる"></figure><figure><figcaption>取り消したあと</figcaption><img src="screenshots/restored-light.png" alt="元のピッコロの席と能力へ戻ったカード"></figure></div></main></html>
