<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指揮の反応を見やすく</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;padding:32px 24px 60px;margin:auto}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>叩いた反応を、見失わない。</h1><p>「ぴったり」などの判定を、合図の上に固定しました。指や光に隠れず、続けて叩いても重なりません。ボタンを覆う円は、面の色が反応する形に整えました。</p><nav><a href="../implementation/qa.html?view=rehearsal&amp;cueFx=full&amp;audioPiece=largo&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=rehearsal&amp;cueFx=short&amp;audioPiece=largo&amp;theme=dark">ダークで試す</a></nav><div class="grid"><figure><img src="screenshots/playing-light.png" alt="375pxのライト。合図の上にぴったりの判定が表示され、タップ面を隠さない"><figcaption>375×812 · ライト</figcaption></figure><figure><img src="screenshots/playing-dark-tall.png" alt="375pxのダーク。判定と合図が重ならない"><figcaption>375×812 · ダーク</figcaption></figure></div><p class="note">確認用の「試す」ではセーブを書き換えません。合奏から「指揮する」で開始できます。<br>iPhoneへ導入・起動済み。実機の見え方・音・操作感は端末で確認できます。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">確認の記録</a></p></main></body></html>
