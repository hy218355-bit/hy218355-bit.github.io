<main><h1>昔の録音に、あの部員がいる</h1><p>卒業して何年たっても、録音したときの顔が舞台に出ます。タップすると当時の名前・学年・楽器・ランクが見られ、その人だけの音も聴けます。</p><p>同じ部員が今は別の名前や楽器になっていても、録音の中は当時のまま。昔のカードには名前変更や席移動を出しません。</p><p><a href="/design/implementation/qa.html?view=recorded-history&theme=light&keys=1">2026年と2027年の録音を試す</a> · <a href="browser-check.json">確認記録</a></p><p>確認例では2031年の部から昔の録音を再生しています。「録音を聴く」で年を選んで聴き、舞台の顔をタップしてください。いつものセーブは変わりません。</p><div class="grid"><figure><figcaption>375px・ライト</figcaption><img src="screenshots/card-light.png" alt="卒業生の録音時の顔と学年・楽器・ランクを表示"></figure><figure><figcaption>ダーク</figcaption><img src="screenshots/card-dark.png" alt="録音時の部員カードをダークで表示"></figure></div></main></html>
