<main><h1>プレビューの読み込みを安定させる</h1><p>起動時に画面が動かない原因の一つを、確認用サーバーのファイル取得で再現しました。接続を受け付ける余裕を増やし、同じ接続を使い回す設定へ切り替えています。</p>
<table><thead><tr><th>確認したこと</th><th>切り替え後</th></tr></thead><tbody><tr><td>起動の繰り返し</td><td>36回すべて、32本を取得</td></tr><tr><td>8005番で同時取得</td><td>96件すべて内容が一致</td></tr><tr><td>通常の画面確認</td><td>4タブ・41音源の合奏まで確認</td></tr></tbody></table>
<p><a href="/design/implementation/qa.html?view=rehearsal&amp;theme=light&amp;keys=1">合奏を試す</a> · <a href="summary.json">比較記録</a> · <a href="probe.html">起動だけの診断</a></p><p>起動だけの診断では、セーブと音源は使いません。通常の確認ページにも、読み込みの記録が残るようにしました。</p>
