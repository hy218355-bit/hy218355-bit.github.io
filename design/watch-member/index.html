<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番の部員カードを使いやすく</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>ひとりを聴いて、舞台へ戻る。</h1><p>本人の音を聴いている間は金色の枠で表示。カードを閉じたら、全員の音に戻ります。Escapeでもカードだけを閉じられ、演奏は続きます。</p><nav><a href="../implementation/qa.html?view=prep-a&amp;theme=light&amp;cueFx=off">ライトで本番を試す</a><a href="../implementation/qa.html?view=prep-a&amp;theme=dark&amp;cueFx=off">ダークで本番を試す</a></nav><p class="note">「本番の演奏をはじめる」から、舞台の顔を押すと本人のカードが開きます。確認ページはセーブを書き換えません。</p><div class="grid"><figure><img src="screenshots/member-light.png" alt="375pxライト。本番の顔カードに本人の試聴と閉じるを表示。本人だけの音は金色の枠で示す"><figcaption>ライト · 課題曲の本番</figcaption></figure><figure><img src="screenshots/member-dark.png" alt="375pxダーク。本人だけの音をキーボードで切り替えてもボタンに操作先が残る"><figcaption>ダーク · 自由曲の本番</figcaption></figure></div><details><summary>小さい画面・長い名前も確認</summary><div class="grid"><figure><img src="screenshots/long-light.png" alt="375×667のライト。12文字の名前を折り返し、閉じると試聴を44px以上で表示"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/long-dark.png" alt="375×667のダーク。長い名前とカードの操作が画面内に収まる"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">iPhoneへ導入済み。端末がロック中のため、今回は起動未確認です。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
