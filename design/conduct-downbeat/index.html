<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小節のはじめを予告する</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>1拍目が、先に見える。</h1><p>小節のはじめを太い金色の光で予告。ラインへ届くと、操作面と「1」も金色に。途中から練習するときも、曲の拍に合わせて数えます。</p><nav><a href="../implementation/qa.html?view=rehearsal&amp;audioPiece=spring&amp;cueFx=full&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=rehearsal&amp;audioPiece=spring&amp;cueFx=off&amp;theme=dark">ダーク・演出なしで試す</a></nav><p class="note">「聴き方」の範囲を「鳥の歌」または「主題（終わり）」にして「指揮する」。それぞれ3拍目・4拍目から数え始めます。確認ページはセーブを書き換えません。</p><div class="grid"><figure><img src="screenshots/spring-light.png" alt="375pxライト。4拍目から数え始め、次の1拍目を太い金色の光で予告する"><figcaption>ライト · 動く光で予告</figcaption></figure><figure><img src="screenshots/spring-dark.png" alt="375pxダーク。固定した金色の光と4つの目印で次の1拍目を知らせる"><figcaption>ダーク · 演出なしの固定予告</figcaption></figure></div><details><summary>小さい画面でも確認</summary><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667のライト。操作面と拍の数字、テンポを画面内へ置く"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667のダーク。2拍子の予告と操作面、テンポが収まる"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">iPhoneへ導入・起動済み。実機の見え方・音・操作感は端末で確認できます。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
