<style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p,li{font-size:14px;line-height:1.9}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<main><h1>いま聴いている録音が分かる</h1><p>録音を聴いていても練習中の曲名と範囲が残っていたため、実際に聴いている内容へ切り替えるようにしました。</p><ul><li>曲名・難しさ・範囲が、再生中の録音にそろう。</li><li>止めると、元の自由曲・課題曲と練習範囲へ戻る。</li><li>その区間で出番のない部員も、当時の席に残る。</li><li>卒業式から聴く場合も、保存された会場の響きを使う。</li></ul><p><a href="/design/implementation/qa.html?view=recorded-history&theme=light&keys=1&different=1&a=1">別の曲の録音で試す</a> · <a href="browser-check.json">確認記録</a></p><p>確認例は、課題曲の「歓喜の歌」を練習中に、《新世界より》第2楽章の前半の録音を再生したところです。いつものセーブは変えません。</p><div class="grid"><figure><figcaption>375px・ライト</figcaption><img src="screenshots/record-light.png" alt="録音中の実際の曲名と当時の部員を表示"></figure><figure><figcaption>ダーク</figcaption><img src="screenshots/record-dark.png" alt="同じ録音をダーク表示で再生"></figure></div></main></html>
