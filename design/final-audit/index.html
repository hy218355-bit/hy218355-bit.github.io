<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吹奏楽部のつくりかた · 仕上げの確認</title><style>body{margin:0;background:#12252f;color:#f3f0e4;font:14px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}header{display:flex;gap:18px;align-items:center}header img{width:60px;height:60px;border-radius:14px}h1{font-size:24px;margin:0}p{margin:8px 0}.status{padding:16px 18px;border:1px solid #42565b;border-radius:14px;background:#1e343d;margin:24px 0}.ok{color:#a5ceba}.pending{color:#e7c38a}a{color:#e7c38a}nav{display:flex;gap:20px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px 24px}section h2{font-size:17px;font-weight:600}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0}figcaption{font-size:12px;color:#b7c5be}figure img{width:100%;height:auto;display:block;margin-top:6px;border:1px solid #42565b;border-radius:12px}footer{margin-top:32px;color:#b7c5be;font-size:12px}.note{font-size:12px;color:#b7c5be}</style></head><body><main><header><img src="/tsukurikata/icon-180.png" alt="承認された紺と真鍮のアプリアイコン"><div><p>吹奏楽部のつくりかた</p><h1>仕上げの確認</h1></div></header><div class="status"><p class="ok">コード検査 39 / 39 · 375pxの24画面 · iOSビルド成功</p><p class="pending">実機への導入：端末の接続待ち</p><p class="note">ミラーリングは使っていません。画像は保存を変更しない確認ページの実画面です。</p></div><nav><a href="/design/implementation/qa.html?view=stage&theme=light&keys=1">保存を変えずに試す</a><a href="README.md">確認の記録</a><a href="../native-export/">録音の保存</a><a href="../venue-fade/">会場の切り替え</a><a href="../playback-stop/">録音の停止</a></nav><div class="grid" id="views"></div><footer>コード・画面・顔・アイコン・年間進行を確認済み。実機への導入と起動、端末での音と操作感は未確認です。</footer></main><script>const views=[['week','今週'],['practice','練習の指示'],['stage','合奏'],['members','部員一覧'],['journal','日誌'],['member','部員カード'],['consult','相談'],['ensemble','アンサンブル人選'],['watch','本番の舞台'],['announce','結果発表'],['grad','卒業式'],['conduct','指揮の予告']];document.querySelector('#views').innerHTML=views.map(([key,label])=>`<section><h2>${label}</h2><div class="pair">${['light','dark'].map(theme=>`<figure><figcaption>${theme==='light'?'ライト':'ダーク'}</figcaption><a href="screenshots/${key}-${theme}.png"><img src="screenshots/${key}-${theme}.png" loading="lazy" alt="375pxの${label}・${theme==='light'?'ライト':'ダーク'}"></a></figure>`).join('')}</div></section>`).join('');</script></body></html>
