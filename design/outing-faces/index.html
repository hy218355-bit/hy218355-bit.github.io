<style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}details{margin-top:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>行事に行く部員を、顔で選ぶ</h1><p>顔とチェックで選び、選んだ子と確定の操作をいつも手元へ。行事が終わったあとも、誰と行ったかがひと目で分かります。</p><p><a href="/design/implementation/qa.html?view=outing-music&amp;theme=light&amp;outingAudit=1&amp;outBench=1&amp;keys=1">顔で選んでみる</a> · <a href="browser-check.json">確認記録</a> · <a href="README.md">変更と確認の詳細</a></p><div class="grid"><figure><figcaption>選んだ部員が手元に残る・ライト</figcaption><img src="screenshots/selected-light.png" alt="顔と金の枠とチェックで3人を選択し、画面下で人数を確かめる" loading="lazy"></figure><figure><figcaption>同じ選択・ダーク</figcaption><img src="screenshots/selected-dark.png" alt="ダークでも選択の枠と確定と中止が見える" loading="lazy"></figure><figure><figcaption>行事のあとにも、顔を残す</figcaption><img src="screenshots/result-light.png" alt="参加した3人の顔と結果、開いて見られる変化" loading="lazy"></figure><figure><figcaption>結果・ダーク</figcaption><img src="screenshots/result-dark.png" alt="参加者の顔と行事の結果のダーク表示" loading="lazy"></figure></div><details><summary>選ぶ前・4人の行事・小さい画面</summary><div class="grid"><figure><figcaption>選ぶ前</figcaption><img src="screenshots/choices-light.png" alt="特に伸びる部員を楽器ごとに表示" loading="lazy"></figure><figure><figcaption>4人までの行事</figcaption><img src="screenshots/four-dark.png" alt="上限4人を選ぶ" loading="lazy"></figure><figure><figcaption>320pxと長い名前</figcaption><img src="screenshots/long-small-dark.png" alt="12文字の名前も画面内に収まる" loading="lazy"></figure><figure><figcaption>選択中も練習を変えられる</figcaption><img src="screenshots/practice-small-dark.png" alt="再生バーがあっても練習メニューと固定ボタンが重ならない" loading="lazy"></figure></div></details><p>確認ページでは本物のセーブと設定を変更しません。iPhone向けの最終ビルド成功。
