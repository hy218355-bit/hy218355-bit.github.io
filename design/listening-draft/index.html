</style></head><body><main><p>B · 舞台の中へ</p><h1>音を変えても、書きかけを保つ。</h1><p>「聴き方」で本人・パート・全員を切り替えても、入力中の名前と開いた成長・思い出を保ちます。演奏もそのまま続きます。</p><div class="grid"><figure><img src="screenshots/draft-light.png" alt="375pxライト。聴き方を本人へ変えた後も、名前欄に未保存のなまえが残っている"><figcaption>ライト · 本人の音へ切り替えた後</figcaption></figure><figure><img src="screenshots/draft-dark.png" alt="375pxダーク。名前の入力欄と同じ試聴ボタンを保つ"><figcaption>ダーク · 同じ入力欄とボタンを保持</figcaption></figure></div><p><a href="../implementation/qa.html?view=member&amp;performanceAudit=1&amp;memberListenAudit=1&amp;theme=light">ライトで試す</a> · <a href="../implementation/qa.html?view=member&amp;performanceAudit=1&amp;memberListenAudit=1&amp;theme=dark">ダークで試す</a></p><p class="note">停止中・再生中・読み込み待ち・録音・1年分の進行を確認済み。<br>iPhoneへ導入・起動済み。実機の見た目・音・操作感はオーナー側で確認。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
