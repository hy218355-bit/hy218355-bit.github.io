<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>アプリアイコン案｜吹奏楽部のつくりかた</title><style>
:root{--paper:#F4F1E9;--sheet:#FFFCF5;--ink:#243E41;--soft:#69746C;--rule:#D4D7C9;--accent:#936B2F;--dark:#172D32;--light:#E9E7DB}@media(prefers-color-scheme:dark){:root{--paper:#12252F;--sheet:#1E343D;--ink:#F3F0E4;--soft:#B7C5BE;--rule:#42565B;--accent:#E7C38A}}
*{box-sizing:border-box}body{margin:0;padding:32px 20px 60px;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.7}main{max-width:1080px;margin:auto}h1{font-size:24px;margin:4px 0}header p{font-size:13px;color:var(--soft);margin:6px 0}header{margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:22px;padding:22px}h2{font-size:17px;margin:0 0 20px}h2 b{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;margin-right:8px}a{display:block;color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.hero{display:block;width:100%;max-width:280px;aspect-ratio:1;margin:auto;border-radius:22.5%}.card p{font-size:13px;color:var(--soft);margin:20px 0}.small{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small figure{margin:0;padding:16px 8px 10px;display:grid;place-items:center;gap:12px;background:var(--light);border-radius:14px}.small figure:last-child{background:var(--dark)}.small img{width:60px;height:60px;border-radius:14px}.small figcaption{color:#68766C;font-size:10px;letter-spacing:.08em}.small figure:last-child figcaption{color:#B8C6BB}footer{font-size:12px;color:var(--soft);margin-top:28px}@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:24px 18px 48px}}
</style></head><body><main><header><p>吹奏楽部のつくりかた</p><h1>アイコンを、もっと軽やかに。</h1><p>比較の記録（3案とも見送り）。アプリには反映していません。</p></header><div class="grid">
<article class="card"><h2><b>A</b>放課後のトランペット</h2><a href="a.png" aria-label="A案を1024pxで見る"><img class="hero" src="a.png" alt="深緑にクリーム色のトランペット。ベルだけ明るい真鍮色。" width="1024" height="1024"></a><p>楽器が伝わる、すっきりした一枚。</p><div class="small"><figure><img src="a-60.png" alt="Aの60px表示" width="60" height="60"><figcaption>LIGHT</figcaption></figure><figure><img src="a-60.png" alt="Aの暗い背景での60px表示" width="60" height="60"><figcaption>DARK</figcaption></figure></div></article>
<article class="card"><h2><b>B</b>ふたつの音</h2><a href="b.png" aria-label="B案を1024pxで見る"><img class="hero" src="b.png" alt="クリーム色の背景に、深緑とキャメルの丸い連桁音符。" width="1024" height="1024"></a><p>クリーム色に、深緑とキャメル。</p><div class="small"><figure><img src="b-60.png" alt="Bの60px表示" width="60" height="60"><figcaption>LIGHT</figcaption></figure><figure><img src="b-60.png" alt="Bの暗い背景での60px表示" width="60" height="60"><figcaption>DARK</figcaption></figure></div></article>
<article class="card"><h2><b>C</b>音楽室の窓</h2><a href="c.png" aria-label="C案を1024pxで見る"><img class="hero" src="c.png" alt="セージ色の背景、丸い窓の中にクリーム色の音符と夕日。" width="1024" height="1024"></a><p>夕方の音楽室を、小さな風景に。</p><div class="small"><figure><img src="c-60.png" alt="Cの60px表示" width="60" height="60"><figcaption>LIGHT</figcaption></figure><figure><img src="c-60.png" alt="Cの暗い背景での60px表示" width="60" height="60"><figcaption>DARK</figcaption></figure></div></article>
</div><footer>すべて自作SVG。外部素材・新しいダウンロードなし。角丸はホーム画面を想定した表示上のプレビューです。アプリへの差し替えはまだ行っていません。</footer></main></body></html>
