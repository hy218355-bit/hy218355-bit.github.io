<main><h1>「席を移す」を開いても崩れない</h1><p>長い移動先の名前がカードを横へ押し広げていました。選択欄を縮められる幅にし、「移す」ボタンと並べて画面内に収めました。</p><p>375pxのライト・ダーク、合奏と部員一覧の両方で確認。席の交代も動きます。</p><p><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">部員カードで試す</a> · <a href="browser-check.json">確認記録</a></p><div class="grid"><figure><figcaption>修正後・ライト</figcaption><img src="screenshots/after-light.png" alt="選択欄と移すボタンが画面内に収まるライト表示"></figure><figure><figcaption>修正後・ダーク</figcaption><img src="screenshots/after-dark.png" alt="同じ席移動欄のダーク表示"></figure></div></main></html>
