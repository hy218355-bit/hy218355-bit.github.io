</style></head><body><main><p>B · 舞台の中へ</p><h1>休みの小節も、同じ舞台に。</h1><p>出番のない録音の区間は、本人の顔の下に「この範囲は休み」と表示します。音のない試聴で、みんなの演奏を無音にしません。</p><div class="grid"><figure><img src="screenshots/rest-light.png" alt="375pxライト。録音当時のピッコロの顔とランクを残し、試聴ボタンをこの範囲は休みの表示へ置き換える"><figcaption>ライト · 出番のない前半</figcaption></figure><figure><img src="screenshots/rest-dark.png" alt="375pxダーク。同じ本人の顔・3年生・ピッコロと休みの表示。録音全体は再生を続ける"><figcaption>ダーク · 全員の音はそのまま</figcaption></figure></div><nav><a href="../implementation/qa.html?view=recorded-history&amp;different=1&amp;libraryAudit=1&amp;recordCardAudit=1&amp;theme=light">ライトで録音を聴く</a><a href="../implementation/qa.html?view=recorded-history&amp;different=1&amp;libraryAudit=1&amp;recordCardAudit=1&amp;theme=dark">ダークで録音を聴く</a></nav><details><summary>小さい画面と、読み込み待ち</summary><p>375×667でも本人の顔と休みが見え、待っている間にも出番のあるパートを選べます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。読み込み待ちでも録音当時の顔と休みを表示"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。休みの試聴ボタンを出さず、下の停止で読み込みを中止できる"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲・57範囲の出番、打楽器の試聴、待機後のパート、1年分の進行を確認済み。<br>iPhoneへ更新し、起動とプロセスを確認。実機の見た目と音はオーナー側で確認します。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
