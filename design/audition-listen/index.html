<style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}.more{margin-top:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<main><h1>人選を変えずに、音を比べる</h1><p>選んだ31人と全員39人を、チェックを変えずに聴き比べる。前に聴いた本人だけの指定が残って、一人しか鳴らなかったり無音になったりする不具合も直しました。</p>
<p><a href="/design/implementation/qa.html?view=audition&amp;theme=light&amp;keys=1">人選を試す</a> · <a href="browser-check.json">操作の確認記録</a></p><p>人選を変えたら、古い組み合わせの再生と読み込み待ちを止めます。試聴中のボタンは停止の絵へ切り替わり、同じ場所で止められます。</p>
<div class="grid"><figure><figcaption>選んだ31人を聴く・ライト</figcaption><img src="screenshots/selected-light.png" alt="おすすめ31人の予想67.3点を表示。31人の試聴を止めるボタンと全員で聴くボタンが並ぶ"></figure><figure><figcaption>選んだ31人を聴く・ダーク</figcaption><img src="screenshots/selected-dark.png" alt="同じ人選と予想のダーク表示。再生中のボタンを金の枠で示す"></figure></div>
<details class="more"><summary>全員の音・本人の音・舞台</summary><div class="grid"><figure><figcaption>人選31人を保って、全員39人で聴く</figcaption><img src="screenshots/all-dark.png" alt="31人の予想67.3点とチェックを保ち、全員39人の音を再生中"></figure><figure><figcaption>その人が吹いたオーディション</figcaption><img src="screenshots/member-dark.png" alt="候補一人のオーディションを再生。本人の停止ボタンと名前を表示"></figure><figure><figcaption>舞台も選んだ31人</figcaption><img src="screenshots/stage-dark.webp" alt="試聴中の31人の顔が舞台に並ぶ"></figure></div></details>
<p>確認ページは本物のセーブと設定を変更しません。iPhoneへのインストールは成功。端末ロックのため、実機の表示と音は未確認です。</p></main></html>
