<main><h1>顔から、思い出をひらく</h1><p>卒業する13人を、名前の羅列から顔のアルバムへ。表紙や最後の集合写真から見たい本人を選び、成長と思い出をゆっくり読めます。</p>
<p><a href="/design/implementation/qa.html?view=retirement-listen&amp;theme=light&amp;keys=1">引退前から試す</a> · <a href="browser-check.json">操作の確認記録</a></p>
<div class="grid"><figure><figcaption>卒業式の表紙・ライト</figcaption><img src="screenshots/cover-light.png" alt="13人の卒業生の顔と名前を3列に並べ、本人を選べる表紙"></figure><figure><figcaption>卒業式の表紙・ダーク</figcaption><img src="screenshots/cover-dark.png" alt="同じ13人の顔が並ぶダークの表紙。前後と次への操作は下に置く"></figure><figure><figcaption>引退前も顔と成長が先に見える</figcaption><img src="screenshots/retirement-light.webp" alt="3列の顔一覧に名前、楽器の印、GからBへの成長を表示"></figure><figure><figcaption>一人ずつ開いて、音を聴く</figcaption><img src="screenshots/person-dark.webp" alt="開いた本人の成長のすぐ下に入部時と最後の録音ボタンを置く"></figure></div>
<details class="more"><summary>本人のふり返りと最後の集合写真</summary><div class="grid"><figure><figcaption>選んだ本人・ライト</figcaption><img src="screenshots/graduation-person-light.png" alt="前田紬の顔、3年間のGから今への成長、最後のひとことと思い出"></figure><figure><figcaption>選んだ本人・ダーク</figcaption><img src="screenshots/graduation-person-dark.png" alt="同じ本人のダーク表示。記録は開いて読める"></figure><figure><figcaption>最後の集合写真からも見直せる</figcaption><img src="screenshots/ending-dark.png" alt="ありがとう先輩たちの言葉と13人の集合写真。もう一度本人へ戻れる"></figure><figure><figcaption>前のセーブと長い名前</figcaption><img src="screenshots/old-long-person-dark.png" alt="入部時の記録がない部員と12文字の名前でも、本人の顔と現在のランクを表示"></figure></div></details>
<p>確認ページは本物のセーブと設定を変えません。iPhoneへインストール済みですが、端末ロックのため実機の表示と音は未確認です。</p></main></html>
