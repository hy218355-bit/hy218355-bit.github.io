<main><h1>誰と、どこへ移るかを先に見る</h1><p>移動先を選ぶまでは「移す」を押せません。選ぶと、本人と交代相手の顔・名前・移動後の席が出ます。音程と音色もG〜Sで見比べられます。</p><p>選ぶだけではセーブは変わりません。控え・空席・同じ楽器への移動も、実際の移動と同じ処理で予告します。</p><p><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">部員カードで試す</a> · <a href="browser-check.json">確認記録</a> · <a href="../seat-move-fix/">前回の横はみ出し修正</a></p><div class="grid"><figure><figcaption>375px・ライト</figcaption><img src="screenshots/swap-light.png" alt="交代する二人の顔と移動後の席、音程と音色の変化"></figure><figure><figcaption>375px・ダーク</figcaption><img src="screenshots/swap-dark.png" alt="同じ席移動の予告をダークで表示"></figure></div></main></html>
