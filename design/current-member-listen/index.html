<main><h1>この子の、今の音を聴く</h1><p>昔の録音を聴いていても、部員一覧から「この人だけ聴く」を押すと、今の本人の音へ切り替わります。「パートだけ聴く」も現在の部員で鳴ります。</p><p>現在の合奏の中では、曲を止めずに本人とパートを切り替えられます。録音の舞台から開いたカードでは、そのころの音を聴けます。</p>
