<main><h1>演奏の楽器と、人選のチェック</h1>
<p>顔を約2割小さくし、下に楽器の形を追加。顔と楽器のどちらを押しても部員カードが開きます。人選は、金の線とチェックが付いている人が選択中です。</p>
<nav><a href="/design/implementation/qa.html?view=stage&theme=light&keys=1">合奏をさわる</a><a href="/design/implementation/qa.html?view=ensemble&theme=light&keys=1">人選をさわる</a></nav>
<h2>本番の舞台 · 375px</h2><div class="grid">
<figure><figcaption>ライト</figcaption><img src="screenshots/performance-light.png" alt="小さくした顔の下に、それぞれの楽器を描いた舞台・ライト"></figure>
<figure><figcaption>ダーク</figcaption><img src="screenshots/performance-dark.png" alt="楽器が明るい線で見える舞台・ダーク"></figure></div>
<h2>アンサンブル · 375px</h2><p>いちばん上の田中七海さんを解除した状態。金の線とチェックが消え、隣の選択中の人と区別できます。</p><div class="grid">
<figure><figcaption>ライト · 解除後</figcaption><img src="screenshots/ensemble-light.png" alt="選択中は金の線とチェック、解除すると通常の線になる人選・ライト"></figure>
<figure><figcaption>ダーク · 解除後</figcaption><img src="screenshots/ensemble-dark.png" alt="ダークでも選択中と解除した人の線が異なる人選"></figure></div>
</main></html>
