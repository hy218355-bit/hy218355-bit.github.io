<div class="tag">吹奏楽部のつくりかた · 舞台の改善</div>
<h1>舞台の、どの子を見ているか。</h1>
<p>選んだ顔を少し大きく、楽器の印にも背景を。部員カードと舞台の席を見比べやすくしました。</p>
<nav class="actions" aria-label="確認ページ"><a href="../implementation/qa.html?view=member&amp;theme=light&amp;keys=1">ライトで試す</a><a href="../implementation/qa.html?view=member&amp;theme=dark&amp;keys=1">ダークで試す</a><a href="README.md">確認記録</a></nav>
<div class="pair">
<figure><figcaption>375px · ライト</figcaption><img src="screenshots/selected-light.png" width="375" height="812" alt="選択中の顔を少し大きくし、楽器に濃い背景を付けた舞台のライト表示"></figure>
<figure><figcaption>375px · ダーク</figcaption><img src="screenshots/selected-dark.png" width="375" height="812" alt="ダーク表示では明るい楽器の背景で選択位置を見つけやすくした舞台"></figure>
</div>
<h2>顔でも、楽器でも、同じ本人へ。</h2>
<p>楽器の背景の下端で、下の列の部員を選んでしまう境界も修正。39席すべてで、顔と楽器の下端から同じ本人を開けることを確認しました。</p>
<div class="pair">
<figure><figcaption>端の席も、選んだ楽器を見つけやすい</figcaption><img loading="lazy" src="screenshots/edge-dark.png" width="375" height="812" alt="右端の打楽器の顔と楽器を強調し、本人の部員カードを開いた画面"></figure>
<figure><figcaption>昔の録音では、あのころの本人を</figcaption><img loading="lazy" src="screenshots/recorded-dark.png" width="375" height="812" alt="改名・席替え前の録音の本人を舞台で選んだ表示"></figure>
</div>
<details><summary>本番と、小さい画面でも</summary><div class="pair"><figure><figcaption>本番の舞台でも、本人とカードがつながる</figcaption><img loading="lazy" src="screenshots/watch-dark.png" width="375" height="812" alt="本番の舞台で選んだ本人の顔と楽器を強調した表示"></figure><figure><figcaption>320px · 端の席も表示</figcaption><img loading="lazy" src="screenshots/small-edge-light.png" width="320" height="568" alt="320px幅で端の打楽器を選んだ舞台"></figure></div></details>
<p class="note">375px両テーマ・4タブ、320px、昔の録音、本番表示を確認。席の位置・力の色・音・採点・成長・保存は変更していません。iPhone用Releaseビルド成功。実機は現在接続できず、実機表示は未確認です。</p>
