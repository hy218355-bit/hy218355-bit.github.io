</style></head><body><main><p>B · 舞台の中へ</p><h1>選んだ仲間を、見失わない。</h1><p>アンサンブルの人選で、選んだ顔を上に残しました。一覧の下まで見ても、どの子を選んだか、空きがいくつあるかを見渡せます。</p><div class="grid"><figure><img src="screenshots/bottom-light.png" alt="375×667ライト。候補一覧の下を見ていても、選んだ5人の顔と3つの空き枠が上に残る"><figcaption>ライト · 選んだ顔をまとめて確認</figcaption></figure><figure><img src="screenshots/bottom-dark.png" alt="375×667ダーク。同じ5人の顔と空き枠を残し、下には試聴と出場の操作がある"><figcaption>ダーク · 候補の操作を保つ</figcaption></figure></div><details><summary>8人を選んだとき</summary><div class="grid"><figure><img src="screenshots/eight-dark.png" alt="8人の顔ですべての枠が埋まり、未選択の候補は従来どおり薄く表示される"><figcaption>外した顔は、その場で一覧から消えます</figcaption></figure></div></details><p><a href="../implementation/qa.html?view=ensemble&amp;ensembleAudit=1&amp;theme=light">ライトで試す</a> · <a href="../implementation/qa.html?view=ensemble&amp;ensembleAudit=1&amp;theme=dark">ダークで試す</a></p><p class="note">0〜8人・選択と顔の一致・全15曲の試聴・1年分の進行を確認済み。<br>iPhoneへ導入済み。今回は端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
