<h1>先が見える指揮</h1><p>2拍先から丸が近づき、輪へ重なった瞬間にタップ。最初のテンポ出しから、次に叩く拍が分かります。</p>
<p><a class="try" href="../implementation/qa.html?view=rehearsal&amp;audioPiece=pomp&amp;cueFx=full&amp;theme=light">合奏を開いて試す</a></p><p>開いたら、下の「指揮する」を押してください。確認専用の部なので、元のセーブには影響しません。</p>
<section><h2>最初のタップ前 · 375px</h2><div class="pair"><figure><img src="screenshots/ready-light.png" alt="ライトの指揮。2拍先の丸と到着する輪、振りかぶる指揮棒"><figcaption>ライト</figcaption></figure><figure><img src="screenshots/ready-dark.png" alt="ダークの指揮。2拍先の丸と到着する輪、振りかぶる指揮棒"><figcaption>ダーク</figcaption></figure></div></section>
<section><h2>動きを抑える設定にも対応</h2><p>演出なし・短く・動きを減らす設定では、丸と棒は固定。4つの目印と輪の点灯で拍を伝えます。</p><div class="pair"><figure><img src="screenshots/calm-light.png" alt="演出なしの指揮。固定した丸と4つの目印"><figcaption>演出なし</figcaption></figure><figure><img src="screenshots/result-light.png" alt="指揮を最後まで演奏し、録音を残せた確認画面"><figcaption>最後まで振ると録音が残る</figcaption></figure></div></section>
<p>判定や指揮の効きは維持。iPhoneへ更新して起動済みです。<a href="README.md">確認の詳細</a></p><p>codex/design · pushなし</p>
