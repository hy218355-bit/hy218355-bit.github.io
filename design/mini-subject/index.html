</style></head><body><main><p>B · 舞台の中へ</p><h1>どの子の音か、顔で分かる。</h1><p>別のタブで聴いている間も、再生バーに本人の顔と楽器を表示。パートだけを聴くときはパート名に切り替わります。押すと演奏を続けたまま合奏へ戻れます。</p><div class="grid"><figure><img src="screenshots/member-light.png" alt="375pxライト。名簿の下の再生バーに田中七海の顔とピッコロの印、本人だけ聴いていることを表示"><figcaption>ライト · 本人1人の音</figcaption></figure><figure><img src="screenshots/member-dark.png" alt="375pxダーク。同じ本人の再生バーと44pxの停止ボタン"><figcaption>ダーク · 開く・止めるを44pxに</figcaption></figure></div><details><summary>パートの音・読み込み待ち・録音時の本人</summary><div class="grid"><figure><img src="screenshots/section-dark.png" alt="今週の下のバーにフルートだけと表示。週送りと重ならない"><figcaption>パートを聴いていることが分かる</figcaption></figure><figure><img src="screenshots/waiting-light.png" alt="375×667。12文字の名前と本人の顔を保った読み込み待ち"><figcaption>小さい画面と長い名前</figcaption></figure><figure><img src="screenshots/recorded-light.png" alt="現在は田中花音に改名していても、2027年の録音では田中葵と当時のピッコロの印を表示"><figcaption>録音は当時の名前と楽器</figcaption></figure></div></details><p class="note">全15曲・実際の音との対応・録音時の本人・1年分の進行を確認済み。<br>iPhoneへ導入済み。今回は端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
