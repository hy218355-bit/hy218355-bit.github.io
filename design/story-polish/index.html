<main><h1>顔から伝わる相談と卒業式</h1>
<p>相談は、顔と名前、本人の話、返答の順に。卒業式は、顔と成長、最後のひとことを中心に整えました。名前・原画・会話・出来事は同じです。</p>
<nav><a href="/design/implementation/qa.html?view=consult&theme=light&keys=1">相談を見る</a><a href="/design/implementation/qa.html?view=grad&theme=light&keys=1">卒業式をさわる</a><a href="../member-polish/">前回の部員カード</a></nav>
<h2>相談 · 375px</h2><p>顔は56px。返答は幅いっぱいにし、答え方の説明は「？」へまとめました。</p><div class="grid">
<figure><figcaption>ライト</figcaption><img src="screenshots/consult-light.png" alt="顔と名前、広い返答ボタンを並べた相談・ライト"></figure>
<figure><figcaption>ダーク</figcaption><img src="screenshots/consult-dark.png" alt="吹き出しで本人の話を見せる相談・ダーク"></figure></div>
<h2>卒業式 · 375px</h2><p>入部時からの4つのランクと、最後のひとこと。「部活の記録」は開いて読めます。読むために触れると自動送りが止まり、下のボタンで前後に移れます。</p><div class="grid">
<figure><figcaption>ライト</figcaption><img src="screenshots/grad-light.png" alt="顔、成長、最後のひとこと、思い出を並べた卒業式・ライト"></figure>
<figure><figcaption>ダーク</figcaption><img src="screenshots/grad-dark.png" alt="戻るボタンを追加し、記録を読み返せる卒業式・ダーク"></figure></div>
