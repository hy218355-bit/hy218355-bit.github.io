<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人選の違いを見比べる</title><style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>人選の違いを見比べる</h1><p>全員で出る場合との点差を表示。安定感・厚み・楽器の違いも、小さな印で示します。詳しい基準は開いて確認できます。</p><p>確認ページで「おすすめ」を押すか、出る人のチェックを変えると比較が出ます。人数を変えるだけでは保存しません。</p><p><a href="/design/implementation/qa.html?view=audition&theme=light&keys=1&audit=1">ライトで試す</a> · <a href="/design/implementation/qa.html?view=audition&theme=dark&keys=1&audit=1">ダークで試す</a> · <a href="browser-check.json">確認記録</a></p><div class="grid"><figure><figcaption>ライト・おすすめの見本</figcaption><img src="screenshots/selected-light.png" alt="全員との差と、安定感・厚み・楽器の変化"></figure><figure><figcaption>ダーク・同じ人選</figcaption><img src="screenshots/selected-dark.png" alt="同じ予想点と響きの比較をダークで表示"></figure></div></main></html>
