<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出場前に、選んだ音を聴く</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>このメンバーの音を、聴いて決める。</h1><p>アンサンブルの人選に、再生ボタンを追加。選んだ3〜8人で試聴でき、選び直すと止まります。聴くだけでは部員や記録は変わりません。</p><nav><a href="../implementation/qa.html?view=ensemble&amp;theme=light&amp;ensembleAudit=1">ライトで試す</a><a href="../implementation/qa.html?view=ensemble&amp;theme=dark&amp;ensembleAudit=1">ダークで試す</a></nav><div class="grid"><figure><img src="screenshots/selection-light.png" alt="375pxライト設定。5人を選んで試聴中。出場ボタンの隣に丸い停止ボタン"><figcaption>ライト · 5人で試聴中</figcaption></figure><figure><img src="screenshots/selection-dark.png" alt="375pxダーク設定。3人を選んで試聴中。選択した人の枠とチェックを金色で示す"><figcaption>ダーク · 3人で試聴中</figcaption></figure></div><details><summary>小さい画面・長い名前・読み込み中</summary><p>読み込み中も同じボタンで中止できます。印の動きは演出の設定に合わせます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト設定。12文字の名前がチェックと重ならず折り返し、再生ボタンに読み込み中の丸い印"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク設定。12文字の名前と読み込み中の印。出場と辞退は手元の一列に置く"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲・45編成で、本番の録音と試聴の音が一致。1年分の進行も確認済み。<br>iPhoneへ導入済み。起動時の接続切断により、実機の起動は未確認です。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
