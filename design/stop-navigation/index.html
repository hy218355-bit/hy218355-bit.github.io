</style></head><body><main><p>B · 舞台の中へ</p><h1>停止したら、次の操作へ。</h1><p>合奏で止めたら再生ボタンへ。別のタブで止めたら、今のタブへ戻ります。停止ボタンを押しても、読んでいた位置のまま。名前の入力中に曲が終わっても、入力を続けられます。</p><div class="grid"><figure><img src="screenshots/main-light.png" alt="375pxライト。演奏を止めると、いまの音で合奏のボタンへ操作先が戻り、金色の枠で示す"><figcaption>ライト · 停止後の再生ボタン</figcaption></figure><figure><img src="screenshots/main-dark.png" alt="375pxダーク。39人の舞台を残し、次に押せる再生ボタンへ戻る"><figcaption>ダーク · 同じ位置から次へ</figcaption></figure></div><nav><a href="../implementation/qa.html?view=rehearsal&amp;stopAudit=1&amp;focusAudit=1&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=rehearsal&amp;stopAudit=1&amp;focusAudit=1&amp;theme=dark">ダークで試す</a></nav><details><summary>別タブでは、読んでいた場所を保つ</summary><p>部員の一覧を667pxスクロールした位置で止めても、タブと位置がそのまま残ります。</p><div class="grid"><figure><img src="screenshots/mini-light.png" alt="375×667ライト。部員一覧のスクロール位置を保ち、部員タブへ操作先を戻す"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/mini-dark.png" alt="375×667ダーク。小さな再生バーが閉じても、現在の部員タブへ戻る"><figcaption>375×667 · ダーク</figcaption></figure></div></details><details><summary>小さい画面と、読み込み中止</summary><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。読み込みを中止した後も、いまの音で合奏へ戻る"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。読み込みを中止すると再生ボタンに金色の枠が付く"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">停止・自然終了・待機中止・入力の保持を確認済み。<br>iPhoneへ更新済み。今回は端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
