<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指揮した音を、聴き返す</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>指揮した音を、聴いて、止めて。</h1><p>結果の同じボタンで録音を聴き返し・停止できます。読み込み待ちも中止でき、画面を閉じると音も止まります。</p><div class="grid"><figure><img src="screenshots/replay-light.png" alt="375pxライト設定の演奏おわり。聴き返し中は金色の止めるボタンになる。保存・再指揮・閉じるは等幅の2列"><figcaption>ライト · 録音を聴き返し中</figcaption></figure><figure><img src="screenshots/replay-dark.png" alt="375pxダーク設定。再生中の止めると、保存する・もう一度指揮する・閉じるの4操作をそろえる"><figcaption>ダーク · 同じ録音を聴き返し中</figcaption></figure></div><nav><a href="../implementation/qa.html?view=stage&amp;audioPiece=largo&amp;cueFx=off&amp;theme=light">ライトで指揮を試す</a><a href="../implementation/qa.html?view=stage&amp;audioPiece=largo&amp;cueFx=off&amp;theme=dark">ダークで指揮を試す</a></nav><details><summary>小さい画面と、読み込み待ち</summary><p>高さ667pxでも操作は46px以上。同じボタンから読み込みを中止できます。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト設定。読み込みをやめる・保存・再指揮・閉じるが画面内に収まる"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク設定。読み込みをやめるを金色で示し、4操作を2列に保つ"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">実際の録音・保存した指揮の時計・待機の中止・閉じる操作・1年分の進行を確認済み。<br>iPhoneへ更新済み。端末ロック中のため起動は未確認です。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
