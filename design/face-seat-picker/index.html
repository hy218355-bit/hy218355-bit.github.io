<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顔で席を選ぶ</title><style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>顔を見ながら、席を選ぶ</h1><p>楽器のまとまりを選び、交代相手の顔をタップ。選んだ席には金の枠とチェックが付き、もう一度押すと解除します。二人の行き先とランクを確認してから移せます。</p><p><a href="/design/implementation/qa.html?view=member&theme=light&keys=1">ライトで試す</a> · <a href="/design/implementation/qa.html?view=member&theme=dark&keys=1">ダークで試す</a> · <a href="browser-check.json">確認記録</a></p><div class="grid"><figure><figcaption>ライト・交代前</figcaption><img src="screenshots/swap-light.png" alt="顔で選んだ交代相手と二人のランクの変化"></figure><figure><figcaption>ダーク・交代前</figcaption><img src="screenshots/swap-dark.png" alt="金の枠とチェックで選択中の席が分かる"></figure></div></main></html>
