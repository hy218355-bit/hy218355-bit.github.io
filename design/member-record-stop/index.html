<main><h1>本人の録音を、安心して聴き比べる</h1><p>入部したころと最後の本番を、同じ部員の音で聴き比べる。停止した後や全員の録音へ切り替えた後も、本人だけの指定が残ってしまう不具合を直しました。</p>
<table><thead><tr><th>操作</th><th>切り替え後</th></tr></thead><tbody><tr><td>読み込み待ちで止める</td><td>後から勝手に鳴らない</td></tr><tr><td>本人から全員の録音へ</td><td>39人で再生</td></tr><tr><td>別の本人へ</td><td>新しく選んだ本人だけ</td></tr><tr><td>卒業式</td><td>引退後も当時の39人で再生</td></tr></tbody></table>
<p><a href="/design/implementation/qa.html?view=retirement-listen&amp;theme=light&amp;keys=1">録音の聴き比べを試す</a> · <a href="browser-check.json">操作の確認記録</a></p><p>確認ページは本物のセーブと設定を変更しません。iPhoneへのインストールは成功。端末のロックにより、実機での表示と音は未確認です。</p>
