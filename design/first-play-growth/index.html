</style><main><small>吹奏楽部のつくりかた</small><h1>最初の一歩と、育った音。</h1><p>朝野先生の案内から最初の本番まで、実際に操作して確認。<br>練習で変わった音は、4月と聴き比べられるようになりました。</p><nav><a href="qa.html?session=owner-first-growth-light&theme=light">最初から試す</a><a href="qa.html?session=owner-first-growth-dark&theme=dark">ダークで試す</a><a href="qa.html?session=owner-month-growth&mode=month&theme=light">1か月後の部を試す</a></nav><p>確認専用の部です。いつものセーブは変わりません。</p><figure><img src="growth-comparison.png" width="750" height="812" alt="音の成長を聴く。4月の音と今の音のボタン、育った部員の顔と本当のGからFへの変化。左がライト、右がダーク"><figcaption>375pxのライト／ダーク。練習した部員の変化を、顔・ランク・音で確かめる。</figcaption></figure><h2>4月と、4週間後の音</h2><p>「天国と地獄」の同じ部分・テンポ・音楽室。4月の5人、1秒の間、いまの7人の順です。音量の補正はしていません。</p><audio controls preload="none" src="before-after.wav">比較の音声</audio><p class="source"><a href="../../tsukurikata/snd/CREDITS.md">楽器の音の出典</a></p><figure><img src="first-comparison.png" width="750" height="812" alt="最初の楽器決めから朝野先生が案内する画面。左がライト、右がダーク"><figcaption>今の段階と、次にすることがそろう初回案内。</figcaption></figure><p>実際の初見参加者によるテストは行わず、初見を想定した操作の検証として実施しています。</p></main></html>
