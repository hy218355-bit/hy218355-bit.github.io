<main><h1>顔で選べるアンサンブル</h1>
<p>顔・楽器・ランクを並べた2列のカード。金の線とチェックが選択中の目印です。選び直しても一覧が跳ねず、「この○人で出る」は画面下から押せます。くわしい説明は「？」へまとめました。</p>
