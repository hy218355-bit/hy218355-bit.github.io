<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診断から、その子の練習へ</title><style>body{margin:0;background:#f0eee5;color:#263d43;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1{font-size:22px}p{font-size:14px;line-height:1.8}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,375px));gap:20px}figure{margin:0}figcaption{margin:12px 0;font-size:13px}img{width:100%;display:block;border-radius:12px}details{margin-top:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>診断から、その子の練習へ</h1><p>診断の下で、譜読み・音程・リズム・音色・表現を切り替え。顔を押すと本人の練習へ進み、選んだら元の顔へ戻ります。見るだけでは指示を変えません。</p><p><a href="/design/implementation/qa.html?view=diag-practice&amp;theme=light&amp;keys=1">診断から練習を選んでみる</a> · <a href="browser-check.json">確認記録</a> · <a href="README.md">変更と確認の詳細</a></p><div class="grid"><figure><figcaption>譜読みから選ぶ・ライト</figcaption><img src="screenshots/reading-light.png" alt="今の譜読みの低い部員から顔とGからSのランクを表示" loading="lazy"></figure><figure><figcaption>音程も、顔で見直す・ダーク</figcaption><img src="screenshots/pitch-dark.png" alt="音程の項目を選ぶと、その力を低い順に3人表示" loading="lazy"></figure><figure><figcaption>顔から本人の練習へ</figcaption><img src="screenshots/picker-light.png" alt="曲の練習を先頭側へ置き、おまかせの選択は保持" loading="lazy"></figure><figure><figcaption>普段は見出しだけ</figcaption><img src="screenshots/collapsed-dark.png" alt="診断の下に顔を添えた練習を見直すの見出しだけを表示" loading="lazy"></figure></div><details><summary>課題曲・小さい画面・長い名前</summary><div class="grid"><figure><figcaption>課題曲は、その曲の譜読みで</figcaption><img src="screenshots/set-reading-light.png" alt="自由曲と別の部員が並ぶ課題曲の譜読み" loading="lazy"></figure><figure><figcaption>320px・12文字の名前</figcaption><img src="screenshots/long-small-dark.png" alt="長い名前が2行に収まり、3人の顔を操作ボタンより上に表示" loading="lazy"></figure><figure><figcaption>再生中もメニューを操作できる</figcaption><img src="screenshots/small-picker-dark.png" alt="練習のメニューと固定ボタンと再生バーが重ならない" loading="lazy"></figure></div></details><p>確認ページは本物のセーブと設定を変更しません。初年度を翌年4月まで進めて、エラーなし。iPhone向けビルド成功。実機に接続できず、最終版の入れ直しと実機での表示確認は未完了です。</p><p><a href="/design/seat-compact/">前の改善：席を、すぐ選べるように</a></p></main></html>
