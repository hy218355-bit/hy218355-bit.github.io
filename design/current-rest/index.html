</style></head><body><main><p>B · 舞台の中へ</p><h1>休みの子も、舞台の一員。</h1><p>この区間で吹かない子は「この範囲は休み」に。顔とランクはそのまま、同じパートの仲間に出番があれば、その音を聴けます。</p><div class="grid"><figure><img src="screenshots/section-light.png" alt="375pxライト。ピッコロの田中七海はこの範囲は休みと示し、フルートパートの試聴を金色で表示"><figcaption>ライト · 本人は休み、パート3人の音</figcaption></figure><figure><img src="screenshots/section-dark.png" alt="375pxダーク。本人の顔とランクを残し、パートだけ聴くと全員の音にもどすを表示"><figcaption>ダーク · 演奏を続けたまま全員へ</figcaption></figure></div><nav><a href="../implementation/qa.html?view=member&amp;audioPiece=galop&amp;audioRange=1&amp;performanceAudit=1&amp;memberListenAudit=1&amp;currentRestAudit=1&amp;theme=light">ライトで試す</a><a href="../implementation/qa.html?view=member&amp;audioPiece=galop&amp;audioRange=1&amp;performanceAudit=1&amp;memberListenAudit=1&amp;currentRestAudit=1&amp;theme=dark">ダークで試す</a></nav><details><summary>曲全体を休む部員と、小さい画面</summary><p>375×667。曲全体に出番がなければ「この曲は休み」。パートの読み込み待ちを中止したあと、遅れて鳴ることもありません。</p><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667ライト。原杏はこの曲は休み、同じ打楽器パートの音を読み込み中"><figcaption>375×667 · ライト</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667ダーク。曲全体を休む部員の顔とランク、パートの試聴操作を表示"><figcaption>375×667 · ダーク</figcaption></figure></div></details><p class="note">全15曲・57区間・入力の保持・読み込み待ちの中止・1年分の進行を確認済み。<br>iPhoneへ導入・起動済み。実機の見た目・音・操作感はオーナー側で確認。<br>ミラーリングなし · codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
