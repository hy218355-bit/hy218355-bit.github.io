<main><h1>選んだ区間から、合奏する</h1><p>再生中に「中間部」へ変えても、前の範囲が鳴り続けていました。範囲を変えたらいったん止め、次に合奏を押すと選んだ区間から始まるようにしました。</p><ul><li>読み込み待ちの古い演奏も取り消す。</li><li>休みの区間でも、部員の顔は元の席に残す。</li><li>通常の合奏と昔の録音のカードを区別したまま保つ。</li></ul><p><a href="/design/implementation/qa.html?view=rehearsal&theme=light&keys=1">合奏の範囲を試す</a> · <a href="browser-check.json">確認記録</a> · <a href="../recording-context/">前回の録音表示</a></p><div class="grid"><figure><figcaption>中間部の合奏・375pxライト</figcaption><img src="screenshots/middle-light.png" alt="中間部を選んで合奏する画面"></figure><figure><figcaption>ダーク</figcaption><img src="screenshots/middle-dark.png" alt="同じ区間の合奏をダークで表示"></figure></div></main></html>
