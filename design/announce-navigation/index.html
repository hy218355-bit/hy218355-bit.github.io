<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結果発表から次へ</title><style>:root{color-scheme:light dark;--bg:#e5eeeb;--ink:#173e43;--soft:#496f6b;--line:#b9cec6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px 60px}h1{font-size:26px}p{font-size:14px;line-height:1.8}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}nav a{padding:12px 18px;border:1px solid var(--line);border-radius:30px;text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;border-radius:18px}figcaption,.note{font-size:12px;color:var(--soft)}figcaption{padding:10px}.note{margin-top:28px}details{margin-top:24px}summary{padding:12px;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}@media(prefers-color-scheme:dark){:root{--bg:#10282f;--ink:#edf3e9;--soft:#a9c4c1;--line:#3b575b}}</style></head><body><main><p>B · 舞台の中へ</p><h1>結果を見て、次へ進む。</h1><p>発表中は結果画面の中で操作。終わったら「結果を見る」へ、閉じたら次の行動へ戻ります。一覧もキーボードで読み返せます。</p><nav><a href="../implementation/qa.html?view=announce&amp;theme=light&amp;cueFx=full&amp;animateAnnounce=1">金賞の発表を試す</a><a href="../implementation/qa.html?view=announce-silver&amp;theme=dark&amp;cueFx=short&amp;animateAnnounce=1">銀賞・短い演出を試す</a></nav><p class="note">Escapeは発表中なら残りを表示し、もう一度押すと結果を閉じます。Tabで一覧へ移り、矢印・Home・Endで読み返せます。確認ページはセーブを書き換えません。</p><div class="grid"><figure><img src="screenshots/result-light.png" alt="375pxライト設定の金賞。結果を見るボタンに金色の操作先の枠を示す"><figcaption>ライト設定 · 金賞</figcaption></figure><figure><img src="screenshots/result-dark.png" alt="375pxダーク設定の銀賞。とばした後も結果画面を残し、結果を見るへ操作先を置く"><figcaption>ダーク設定 · 銀賞</figcaption></figure></div><details><summary>小さい画面・B部門も確認</summary><div class="grid"><figure><img src="screenshots/small-light.png" alt="375×667のライト設定。B部門の銅賞と画面内の結果を見るボタン"><figcaption>375×667 · ライト設定</figcaption></figure><figure><img src="screenshots/small-dark.png" alt="375×667のダーク設定。短い演出が自然終了し、結果を見るへ操作先が移る"><figcaption>375×667 · ダーク設定</figcaption></figure></div></details><p class="note">iPhoneへ導入済み。端末がロック中のため、今回は起動未確認です。ミラーリングなし。<br>codex/design · pushなし · <a href="README.md">変更と確認の記録</a></p></main></body></html>
