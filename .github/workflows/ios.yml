# 吹部日誌 iOSアプリ：シミュレータ用とiPhone用（署名なし）にビルドし、シミュレータの中で動作確認する
name: iOS app
on:
  push:
    paths: ['suibu/**', 'suibu-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild -project suibu-ios/Suibu.xcodeproj -scheme Suibu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Build for simulator (Debug)
        run: |
          xcodebuild -project suibu-ios/Suibu.xcodeproj -scheme Suibu -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            build | tail -40
          APP=build-sim/Build/Products/Debug-iphonesimulator/Suibu.app
          ls "$APP" | head -20
          du -sh "$APP" "$APP/Game/suibu"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          c = [(k, d) for k, v in devs.items() if 'iOS' in k for d in v if d['name'].startswith('iPhone')]
          c.sort(key=lambda x: x[0])
          print(c[-1][1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/Suibu.app
      - name: Self-test inside the app (WebKit)
        timeout-minutes: 8
        run: |
          # アプリが自分で数小節を書き出して、結果を書類フォルダの selftest.txt に書く
          xcrun simctl launch --stdout="$PWD/app-stdout.txt" --stderr="$PWD/app-stderr.txt" "$UDID" io.github.hy218355-bit.suibu -selftest
          DATA=$(xcrun simctl get_app_container "$UDID" io.github.hy218355-bit.suibu data)
          for i in $(seq 1 120); do
            grep -q "^SELFTEST" "$DATA/Documents/selftest.txt" 2>/dev/null && break
            sleep 3
          done
          xcrun simctl io "$UDID" screenshot shot-selftest.png || true
          echo "--- app stdout"; cat app-stdout.txt || true
          echo "--- app stderr (last lines)"; tail -30 app-stderr.txt || true
          echo "--- selftest.txt"; cat "$DATA/Documents/selftest.txt" || true
          grep -q "SELFTEST OK" "$DATA/Documents/selftest.txt"
      - name: Screenshot after normal launch
        if: always()
        run: |
          xcrun simctl terminate "$UDID" io.github.hy218355-bit.suibu || true
          xcrun simctl launch "$UDID" io.github.hy218355-bit.suibu
          sleep 25
          xcrun simctl io "$UDID" screenshot shot-light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 4
          xcrun simctl io "$UDID" screenshot shot-dark.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            shot-*.png
            app-stdout.txt
            app-stderr.txt
          if-no-files-found: ignore
