# 吹部日誌 iOSアプリ：シミュレータ用とiPhone用（署名なし）にビルドし、シミュレータの中で動作確認する
name: iOS app
on:
  push:
    paths: ['suibu/**', 'suibu-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild -project suibu-ios/Suibu.xcodeproj -scheme Suibu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Build for simulator (Debug)
        run: |
          xcodebuild -project suibu-ios/Suibu.xcodeproj -scheme Suibu -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            build | tail -40
          APP=build-sim/Build/Products/Debug-iphonesimulator/Suibu.app
          ls "$APP" | head -20
          du -sh "$APP" "$APP/Game/suibu"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
      - name: Pick simulators (notch iPhone and 13-inch iPad)
        run: |
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          c = sorted(((k, d) for k, v in devs.items() if 'iOS' in k for d in v), key=lambda x: x[0])
          for w in sys.argv[1:]:
              m = [x for x in c if x[1]['name'].startswith(w)]
              if m: print(m[-1][1]['udid']); break
          " "$@"; }
          echo "IPHONE=$(pick 'iPhone 16 Pro Max' 'iPhone 15 Pro Max' 'iPhone 16 Pro' 'iPhone')" >> "$GITHUB_ENV"
          echo "IPAD=$(pick 'iPad Pro 13-inch' 'iPad Pro (12.9-inch)' 'iPad Pro' 'iPad')" >> "$GITHUB_ENV"
      - name: Boot iPhone
        run: |
          xcrun simctl list devices | grep "$IPHONE"
          xcrun simctl boot "$IPHONE"
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl status_bar "$IPHONE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$IPHONE" build-sim/Build/Products/Debug-iphonesimulator/Suibu.app
      - name: Self-test inside the app (WebKit)
        timeout-minutes: 8
        run: |
          # アプリが自分で数小節を書き出して、結果を書類フォルダの selftest.txt に書く
          xcrun simctl launch --stdout="$PWD/app-stdout.txt" --stderr="$PWD/app-stderr.txt" "$IPHONE" io.github.hy218355-bit.suibu -selftest
          DATA=$(xcrun simctl get_app_container "$IPHONE" io.github.hy218355-bit.suibu data)
          for i in $(seq 1 120); do
            grep -q "^SELFTEST" "$DATA/Documents/selftest.txt" 2>/dev/null && break
            sleep 3
          done
          echo "--- app stdout"; cat app-stdout.txt || true
          echo "--- app stderr (last lines)"; tail -30 app-stderr.txt || true
          echo "--- selftest.txt"; cat "$DATA/Documents/selftest.txt" || true
          grep -q "SELFTEST OK" "$DATA/Documents/selftest.txt"
      - name: Screenshots (iPhone)
        if: always()
        run: |
          shot() {  # 画面名 タブ [dark]
            xcrun simctl ui "$IPHONE" appearance "${3:-light}"
            xcrun simctl terminate "$IPHONE" io.github.hy218355-bit.suibu || true
            xcrun simctl launch "$IPHONE" io.github.hy218355-bit.suibu -tab "$2"
            sleep 14
            xcrun simctl io "$IPHONE" screenshot "shot-iphone-$1.png"
          }
          shot week week
          shot play play
          shot members members
          shot play-dark play dark
      - name: Self-test and screenshots (iPad)
        if: always()
        timeout-minutes: 14
        run: |
          # CI のマシンはメモリが少ないので、iPhone のシミュレータを止めてから iPad を起動する
          xcrun simctl shutdown "$IPHONE" || true
          xcrun simctl list devices | grep "$IPAD"
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # 固まったら打ち切る
          limit 240 xcrun simctl install "$IPAD" build-sim/Build/Products/Debug-iphonesimulator/Suibu.app
          # iPad でも同じセルフテストを通す（初回起動は時間がかかるので、これで温めてから撮る）
          limit 240 xcrun simctl launch "$IPAD" io.github.hy218355-bit.suibu -selftest
          DATA=$(xcrun simctl get_app_container "$IPAD" io.github.hy218355-bit.suibu data)
          for i in $(seq 1 120); do
            grep -q "^SELFTEST" "$DATA/Documents/selftest.txt" 2>/dev/null && break
            sleep 3
          done
          echo "--- iPad selftest.txt"; cat "$DATA/Documents/selftest.txt" || true
          for t in play week; do
            xcrun simctl terminate "$IPAD" io.github.hy218355-bit.suibu || true
            limit 120 xcrun simctl launch "$IPAD" io.github.hy218355-bit.suibu -tab "$t"
            sleep 20
            xcrun simctl io "$IPAD" screenshot "shot-ipad-$t.png"
          done
          grep -q "SELFTEST OK" "$DATA/Documents/selftest.txt"
      - name: Print small screenshots to the log
        if: always()
        run: |
          # ログからも見られるように、縮小したJPEGを base64 で出す
          for f in shot-*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 50 -Z 900 "$f" --out "small.jpg" >/dev/null
            echo "SHOT ${f%.png} $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')$(base64 -i small.jpg | tr -d '\n')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            shot-*.png
            app-stdout.txt
            app-stderr.txt
          if-no-files-found: ignore
