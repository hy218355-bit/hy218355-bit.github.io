# 吹部日誌 iOSアプリを署名して TestFlight に上げる。Actions の画面から手動で実行する
#
# 先にやっておくこと（一度だけ）
# 1. App Store Connect でこのアプリを作る（Bundle ID は下の BUNDLE_ID と同じもの）
# 2. App Store Connect →「ユーザとアクセス」→「統合」→ App Store Connect API で、アクセスが Admin のキーを作る
#    （Admin でないと、署名に使う証明書とプロファイルを Apple 側で作れない）
# 3. GitHub のリポジトリ → Settings → Secrets and variables → Actions に入れる
#      Secrets：ASC_KEY_ID（キーID）、ASC_ISSUER_ID（発行者ID）、ASC_KEY_P8（.p8 ファイルの中身）、APPLE_TEAM_ID（チームID）
#      Variables（任意）：SUIBU_BUNDLE_ID（Bundle ID を変えるとき）
# 実行のしかた（どれか）
#   - Actions →「TestFlight」→ Run workflow（main に入ってから）
#   - testflight- で始まるタグを push する
#   - claude/ のブランチに、メッセージに [testflight] を含むコミットを push する
# 署名は Xcode の自動署名にまかせる。ビルド番号は Xcode がアップロードのときに重ならないよう決める
name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['testflight-*']
    branches: ['claude/**']
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/testflight-') || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.SUIBU_BUNDLE_ID || 'io.github.hy218355-bit.suibu' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          miss=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::$v が設定されていません（Settings → Secrets and variables → Actions）"; miss=1; }
          done
          xcodebuild -version
          echo "Bundle ID: $BUNDLE_ID"
          exit $miss
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project suibu-ios/Suibu.xcodeproj -scheme Suibu -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Suibu.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CODE_SIGN_STYLE=Automatic \
            archive | tail -80
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Suibu.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -80
          ver=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/Suibu.xcarchive/Info.plist")
          echo "吹部日誌 $ver を TestFlight に送りました。App Store Connect での処理が終わると、TestFlight アプリに出ます（数分〜30分ほど）。" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
